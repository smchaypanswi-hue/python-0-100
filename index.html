<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python 0→100</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--tx:#1b2433;--mut:#5d6b82;--ac:#3776ab;--ac2:#f7c948;--bd:#dde3ee;--code:#0f1724;--codetx:#d7e3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d121c;--card:#161d2b;--tx:#e8eefb;--mut:#93a1ba;--bd:#26314a;--ac:#6aa9e0;--code:#080c14}}
:root[data-theme="dark"]{--bg:#0d121c;--card:#161d2b;--tx:#e8eefb;--mut:#93a1ba;--bd:#26314a;--ac:#6aa9e0;--code:#080c14}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.6}
.hide{display:none!important}
#lobby{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(160deg,#1d3f66,#3776ab 55%,#f7c948);color:#fff}
#lobby h1{font-size:clamp(2.4rem,9vw,4.5rem);margin:0}
#lobby p{max-width:520px;opacity:.95}
.big{background:#fff;color:#1d3f66;border:0;border-radius:999px;padding:14px 36px;font:700 1.1rem inherit;font-family:inherit;cursor:pointer;margin-top:12px}
.pill{display:inline-block;background:rgba(255,255,255,.2);padding:4px 14px;border-radius:99px;margin:4px;font-size:.9rem}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:5;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header b{color:var(--ac);cursor:pointer;margin-right:auto}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:.95rem}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px}.mut{color:var(--mut);font-size:.92rem}
pre{background:var(--code);color:var(--codetx);padding:12px;border-radius:10px;overflow-x:auto;margin:8px 0;font:.9rem/1.5 ui-monospace,Menlo,Consolas,monospace}
.out{border-left:4px solid var(--ac2)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));width:0;transition:width .3s}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:6px 12px;border-radius:99px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--ac2);color:#222;border-color:var(--ac2)}
input[type=search]{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit;font-size:1rem}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.tw{overflow-x:auto}code.k{background:var(--code);color:var(--ac2);padding:2px 8px;border-radius:6px}
.sm{font-size:.85rem;padding:5px 10px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<section id="lobby">
  <div style="font-size:4rem">🐍</div>
  <h1>Python 0 → 100</h1>
  <p>เรียนเขียนโค้ด Python ตั้งแต่ไม่เคยเขียนโปรแกรมเลย ไปจนถึงเขียน OOP และโปรเจกต์ได้เอง เรียนทีละขั้น มีตัวอย่างโค้ดและผลลัพธ์</p>
  <div><span class="pill">💻 Code</span><span class="pill">📘 เนื้อหา</span><span class="pill">🔤 คำศัพท์</span><span class="pill">📦 Import</span></div>
  <button class="big" onclick="enter()">เริ่มเรียนเลย →</button>
</section>

<div id="app" class="hide">
  <header><b onclick="lobby()">🐍 Python 0→100</b>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
</div>

function py2js(src){
 const strs=[],out=[],st=[0];let pend=false,m;
 for(const raw of src.replace(/\t/g,"    ").split("\n")){

  if(!s)continue;
  if(pend){st.push(ind);pend=false}else while(ind<st[st.length-1]){st.pop();out.push("}")}
  const blk=s.endsWith(":");if(blk)s=s.slice(0,-1).trim();

  if(/^class\s/.test(s))throw new Error("NotSupported: ตัวจำลองยังไม่รองรับ class ให้คัดลอกโค้ดไปรันใน Python จริง");

  s=tx(s);
  if(m=s.match(/^elif\s+(.+)$/))out.push(`else if(${m[1]}){`);
  else if(s=="else")out.push("else{");
  else if(m=s.match(/^if\s+(.+)$/))out.push(`if(${m[1]}){`);
  else if(m=s.match(/^while\s+(.+)$/))out.push(`while((${m[1]})&&__g()){`);
  else if(m=s.match(/^def\s+(\w+)\((.*)\)$/))out.push(`function ${m[1]}(${m[2]}){`);
  else if(s=="try")out.push("try{");
  else if(m=s.match(/^except(?:\s+[\w.]+)?(?:\s+as\s+(\w+))?$/))out.push(`catch(${m[1]||"__e"}){`);
  else if(s=="finally")out.push("finally{");
  else if(m=s.match(/^with\s+(.+)\s+as\s+(\w+)$/))out.push(`{var ${m[2]}=${m[1]};`);
  else{
   if(m=s.match(/^([A-Za-z_]\w*(?:\s*,\s*[A-Za-z_]\w*)+)\s*=(?!=)\s*(.*)$/))s=`var [${m[1]}]=[${m[2]}]`;

 }
